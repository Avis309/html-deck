<!DOCTYPE html>
<!-- remote-scripts fixture: a CDN script, plus one loaded dynamically from another origin -->
<html lang="vi">
<head>
<meta charset="utf-8">
<title>CDN fixture</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js"></script>
</head>
<body>
<h1 id="c1">Remote scripts</h1>
<script>
  window.__inline = true;
  // localhost is another origin than 127.0.0.1: "remote" for the edit preview's policy.
  var sc = document.createElement('script');
  sc.src = location.protocol + '//localhost:' + location.port + '/reveal/dist/reveal.js';
  sc.onload = function () { window.__dyn = 'loaded'; };
  sc.onerror = function () { window.__dyn = 'blocked'; };
  document.head.appendChild(sc);
  // Fetching code to eval it is a remote script too.
  fetch(location.protocol + '//localhost:' + location.port + '/reveal/dist/reveal.css')
    .then(function () { window.__fetch = 'ok'; }, function () { window.__fetch = 'blocked'; });
</script>
</body>
</html>
