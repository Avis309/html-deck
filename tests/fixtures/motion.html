<!DOCTYPE html>
<!-- motion fixture: CSS animation (fill forwards), infinite animation, transition, script WAAPI -->
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Motion fixture</title>
<style>
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  #fadein { opacity: 0; animation: fadeIn 3s .5s forwards; }
  #spinner { display: inline-block; animation: spin 1s linear infinite; }
  #trans { color: rgb(0, 0, 0); transition: color 5s; }
  #trans.on { color: rgb(255, 0, 0); }
</style>
</head>
<body>
<h1 id="fadein">Fades in</h1>
<div id="spinner">Spin</div>
<p id="trans">Transition</p>
<p id="waapi">Web animation</p>
<p id="late">Played again</p>
<script>
  window.__mode = window.__HTMLDECK__ ? window.__HTMLDECK__.mode : 'none';
  document.getElementById('waapi').animate([{ opacity: 0 }, { opacity: 1 }], { duration: 4000, fill: 'forwards' });
  setTimeout(function () { document.getElementById('trans').classList.add('on'); }, 50);
  // A loop awaiting each run, and an animation played again later.
  var loops = 0;
  (async function () { for (;;) { loops++; await document.getElementById('spinner').animate([{ opacity: 0.5 }, { opacity: 1 }], { duration: 1000 }).finished; if (loops > 100000) break; } })();
  window.__loops = function () { return loops; };
  var la = window.__late = document.getElementById('late').animate([{ opacity: 0 }, { opacity: 1 }], { duration: 2000, fill: 'forwards' });
  setTimeout(function () { la.play(); }, 300);
</script>
</body>
</html>
