<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Mutating fixture</title></head>
<body>
<h1 id="static">Static heading</h1>
<p id="counter" data-count="42">42</p>
<div id="slot"></div>
<p id="host">Host text</p>
<ul id="list"><li id="dup">Duplicated item</li><li>Second item</li></ul>
<p id="ws">A&nbsp;&amp; B  C</p>
<p id="later">Later text</p>
<p id="later2">Second later</p>
<p id="echo">Echo text</p>
<p id="echo2">Window echo</p>
<script>
  // Simulates an animated page: rewrites a node, injects style and generated nodes at runtime.
  document.getElementById('counter').textContent = '0';
  document.getElementById('static').style.opacity = '0.5';
  document.getElementById('slot').innerHTML = '<p class="gen">Generated by script</p>';
  document.getElementById('host').insertAdjacentHTML('beforeend', ' <b class="gen2">injected</b>');
  const dup = document.getElementById('dup');
  dup.parentNode.insertBefore(dup.cloneNode(true), dup);
  // Called by the spec while a block is being edited.
  window.mutateLater = () => { document.getElementById('later').firstChild.data = 'Changed by script'; };
  // A script faking an edit: rewrites the block and fires an untrusted input event.
  window.synthInput = () => { const e = document.getElementById('later2'); e.firstChild.data = 'hacked'; e.dispatchEvent(new Event('input', { bubbles: true })); };
  // A page handler reacting to the user's own typing by injecting markup (same task as the edit).
  // Same, but a capture listener on window (registered before the editor's own listeners).
  window.addEventListener('input', e => {
    if (e.target.id === 'echo2' && !window.__echoed2) { window.__echoed2 = 1; e.target.insertAdjacentHTML('beforeend', '<i>w</i>'); }
  }, true);
  document.getElementById('echo').addEventListener('input', e => {
    if (!window.__echoed) { window.__echoed = 1; e.currentTarget.insertAdjacentHTML('beforeend', '<i>echo</i>'); }
  });
</script>
</body>
</html>
