[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "htmldeck"
version = "0.1.0"
description = "Edit and present the HTML documents (decks, reports, pages) of a workspace — in place, without rewriting the file."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Avis", email = "hunganh.freeze@gmail.com" }]
keywords = ["html", "slides", "presentation", "editor", "reveal.js", "claude-code", "codex"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: Presentation",
]
dependencies = []   # standard library only

[project.urls]
Homepage = "https://github.com/Avis309/html-deck"
Repository = "https://github.com/Avis309/html-deck"
Issues = "https://github.com/Avis309/html-deck/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "build>=1"]

[project.scripts]
htmldeck = "htmldeck.server:main"
htmldeck-notes = "htmldeck.notes:main"

[tool.setuptools]
packages = ["htmldeck"]

[tool.setuptools.package-data]
htmldeck = ["web/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py311"
extend-exclude = [".venv", "node_modules"]

[tool.ruff.lint]
# Real bugs only, no cosmetics (same policy as the workspace HtmlDeck came from).
select = ["F", "E902", "E711", "E712", "E713", "E714", "E721", "E722", "W605", "B006", "B008", "B905", "PLW1508", "PLW1510"]
